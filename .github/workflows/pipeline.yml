name: Tourism Project Pipeline

on:
  push:
    branches:
      - main

jobs:

  # -----------------------------
  # 1. REGISTER DATASET
  # -----------------------------
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install pandas huggingface_hub

      - name: Register Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd
          from huggingface_hub import hf_hub_download

          repo_id = "Anujgour47/tourism-customer-data"

          file_path = hf_hub_download(
              repo_id=repo_id,
              filename="tourism.csv",
              repo_type="dataset"
          )

          df = pd.read_csv(file_path)

          print("Dataset registered successfully.")
          print("Dataset shape:", df.shape)
          print("Columns:", list(df.columns))
          PY


  # -----------------------------
  # 2. DATA PREPARATION
  # -----------------------------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install pandas scikit-learn huggingface_hub

      - name: Prepare Dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd
          from sklearn.model_selection import train_test_split
          from huggingface_hub import hf_hub_download, HfApi

          repo_id = "Anujgour47/tourism-customer-data"

          file_path = hf_hub_download(
              repo_id=repo_id,
              filename="tourism.csv",
              repo_type="dataset"
          )

          df = pd.read_csv(file_path)

          # Remove CustomerID
          if "CustomerID" in df.columns:
              df = df.drop(columns=["CustomerID"])

          # Handle missing values
          for col in df.select_dtypes(include="object").columns:
              df[col] = df[col].fillna(df[col].mode()[0])

          for col in df.select_dtypes(exclude="object").columns:
              df[col] = df[col].fillna(df[col].median())

          # Stratified train-test split
          train_df, test_df = train_test_split(
              df,
              test_size=0.20,
              random_state=42,
              stratify=df["ProdTaken"]
          )

          train_df.to_csv("train.csv", index=False)
          test_df.to_csv("test.csv", index=False)

          print("Data preparation completed.")
          print("Train shape:", train_df.shape)
          print("Test shape:", test_df.shape)

          # Upload prepared data back to Hugging Face
          api = HfApi(token="${{ secrets.HF_TOKEN }}")

          api.upload_file(
              path_or_fileobj="train.csv",
              path_in_repo="train.csv",
              repo_id=repo_id,
              repo_type="dataset"
          )

          api.upload_file(
              path_or_fileobj="test.csv",
              path_in_repo="test.csv",
              repo_id=repo_id,
              repo_type="dataset"
          )

          print("Train and test datasets uploaded successfully.")
          PY


  # -----------------------------
  # 3. MODEL TRAINING + MLFLOW
  # -----------------------------
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn joblib mlflow huggingface_hub

      - name: Train Model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import pandas as pd
          import joblib
          import mlflow
          import mlflow.sklearn

          from sklearn.compose import ColumnTransformer
          from sklearn.pipeline import Pipeline
          from sklearn.preprocessing import StandardScaler, OneHotEncoder
          from sklearn.ensemble import RandomForestClassifier
          from sklearn.model_selection import GridSearchCV
          from sklearn.metrics import (
              accuracy_score,
              precision_score,
              recall_score,
              f1_score,
              roc_auc_score
          )

          from huggingface_hub import HfApi

          # Load prepared data
          train_df = pd.read_csv("train.csv")
          test_df = pd.read_csv("test.csv")

          X_train = train_df.drop(columns=["ProdTaken"])
          y_train = train_df["ProdTaken"]

          X_test = test_df.drop(columns=["ProdTaken"])
          y_test = test_df["ProdTaken"]

          numeric_features = X_train.select_dtypes(
              include=["int64", "float64"]
          ).columns.tolist()

          categorical_features = X_train.select_dtypes(
              include=["object"]
          ).columns.tolist()

          preprocessor = ColumnTransformer(
              transformers=[
                  (
                      "num",
                      StandardScaler(),
                      numeric_features
                  ),
                  (
                      "cat",
                      OneHotEncoder(handle_unknown="ignore"),
                      categorical_features
                  )
              ]
          )

          rf_pipeline = Pipeline([
              ("preprocessor", preprocessor),
              (
                  "model",
                  RandomForestClassifier(
                      random_state=42
                  )
              )
          ])

          param_grid = {
              "model__n_estimators": [100, 200],
              "model__max_depth": [None, 10, 20],
              "model__min_samples_split": [2, 5],
              "model__min_samples_leaf": [1, 2]
          }

          grid_search = GridSearchCV(
              rf_pipeline,
              param_grid,
              cv=5,
              scoring="f1",
              n_jobs=-1
          )

          grid_search.fit(X_train, y_train)

          best_model = grid_search.best_estimator_

          predictions = best_model.predict(X_test)
          probabilities = best_model.predict_proba(X_test)[:, 1]

          accuracy = accuracy_score(y_test, predictions)
          precision = precision_score(y_test, predictions)
          recall = recall_score(y_test, predictions)
          f1 = f1_score(y_test, predictions)
          roc_auc = roc_auc_score(y_test, probabilities)

          print("Best Parameters:")
          print(grid_search.best_params_)

          print("\nTest Metrics:")
          print("Accuracy:", accuracy)
          print("Precision:", precision)
          print("Recall:", recall)
          print("F1:", f1)
          print("ROC-AUC:", roc_auc)

          # Save model
          model_path = "best_random_forest.pkl"
          joblib.dump(best_model, model_path)

          # MLflow tracking
          mlflow.set_experiment("Tourism Package Prediction")

          with mlflow.start_run(
              run_name="GitHub Actions - Tuned Random Forest"
          ):

              mlflow.log_params({
                  "n_estimators": grid_search.best_params_[
                      "model__n_estimators"
                  ],
                  "max_depth": grid_search.best_params_[
                      "model__max_depth"
                  ],
                  "min_samples_split": grid_search.best_params_[
                      "model__min_samples_split"
                  ],
                  "min_samples_leaf": grid_search.best_params_[
                      "model__min_samples_leaf"
                  ],
                  "cv": 5
              })

              mlflow.log_metrics({
                  "accuracy": accuracy,
                  "precision": precision,
                  "recall": recall,
                  "f1": f1,
                  "roc_auc": roc_auc,
                  "best_cv_f1": grid_search.best_score_
              })

              mlflow.log_artifact(
                  model_path,
                  artifact_path="model"
              )

          # Upload trained model to Hugging Face
          api = HfApi(token="${{ secrets.HF_TOKEN }}")

          api.upload_file(
              path_or_fileobj=model_path,
              path_in_repo="best_random_forest.pkl",
              repo_id="Anujgour47/tourism-package-predictor",
              repo_type="model"
          )

          print("\nModel uploaded successfully to Hugging Face.")
          PY


  # -----------------------------
  # 4. DEPLOYMENT / HOSTING CHECK
  # -----------------------------
  deploy-hosting:
    needs: model-training
    runs-on: ubuntu-latest

    steps:
      - name: Check Streamlit Deployment
        run: |
          echo "Checking Streamlit application..."

          for i in {1..10}; do
            if curl -L --fail --silent \
              "https://tourism-package-predictor-6hd5qjru7nb6gup2tnhkbw.streamlit.app" \
              > /dev/null; then

              echo "Streamlit application is live."
              exit 0
            fi

            echo "Waiting for deployment..."
            sleep 15
          done

          echo "Streamlit deployment check failed."
          exit 1
